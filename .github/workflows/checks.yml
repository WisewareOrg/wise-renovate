name: checks

on:
  pull_request:

permissions: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `name:` equals the id, which is also the required-status-check context the `process-gates`
  # ruleset names.
  check-eol:
    name: check-eol
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: WisewareOrg/wise-ci/check-eol@79c36fe75190c38088a181d2da8461877e7416d3
